<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Tab Wallpaper - Options</title>
    <link rel="icon" type="image/png" sizes="any" href="icons/tab.png" />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        max-width: 800px;
        margin: 24px auto;
        padding: 0 16px;
        color: #222;
      }
      h1 {
        font-size: 1.5rem;
      }
      p {
        color: #555;
        line-height: 1.5;
      }
      textarea {
        width: 100%;
        min-height: 360px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.9rem;
        padding: 8px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 4px;
        resize: vertical;
      }
      .toolbar {
        margin-top: 12px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      button {
        padding: 8px 16px;
        font-size: 0.95rem;
        background: #1a73e8;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover {
        background: #1765cc;
      }
      #status {
        font-size: 0.9rem;
      }
      #status.success {
        color: #1e8e3e;
      }
      #status.error {
        color: #c5221f;
      }
      #count {
        color: #666;
        font-size: 0.85rem;
      }
      #check-result {
        margin-top: 16px;
        font-size: 0.9rem;
      }
      #check-result ul {
        margin: 8px 0 0;
        padding-left: 20px;
        max-height: 240px;
        overflow-y: auto;
        word-break: break-all;
      }
      #check-result .success {
        color: #1e8e3e;
      }
      #check-result .error {
        color: #c5221f;
      }
      button.secondary {
        background: #fff;
        color: #1a73e8;
        border: 1px solid #1a73e8;
      }
      button.secondary:hover {
        background: #f0f6ff;
      }
      button.danger {
        background: #fff;
        color: #c5221f;
        border: 1px solid #c5221f;
      }
      button.danger:hover {
        background: #fdecec;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
    </style>
    <script type="module" src="options.js"></script>
  </head>
  <body>
    <h1>Tab Wallpaper Options</h1>
    <p>
      Enter one image URL per line to display on the new tab page.<br />
      Running Link Check caches image data locally so new tabs can display it instantly.
    </p>
    <textarea
      id="url-list"
      placeholder="https://example.com/image1.jpg&#10;https://example.com/image2.jpg"
    ></textarea>
    <div class="toolbar">
      <button id="save" type="button">Save</button>
      <button id="check" type="button" class="secondary">Link Check</button>
      <button id="remove-failed" type="button" class="danger" hidden>
        Remove failed URLs
      </button>
      <span id="count"></span>
      <span id="status"></span>
    </div>
    <div id="check-result"></div>
  </body>
</html>
