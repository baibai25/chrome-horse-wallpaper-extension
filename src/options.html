<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Horse Wallpaper - Options</title>
    <link rel="icon" href="icons/tab.png" type="image/x-icon" />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        max-width: 800px;
        margin: 24px auto;
        padding: 0 16px;
        color: #222;
      }
      h1 {
        font-size: 1.5rem;
      }
      p {
        color: #555;
        line-height: 1.5;
      }
      textarea {
        width: 100%;
        min-height: 360px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.9rem;
        padding: 8px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 4px;
        resize: vertical;
      }
      .toolbar {
        margin-top: 12px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      button {
        padding: 8px 16px;
        font-size: 0.95rem;
        background: #1a73e8;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover {
        background: #1765cc;
      }
      #status {
        font-size: 0.9rem;
      }
      #status.success {
        color: #1e8e3e;
      }
      #status.error {
        color: #c5221f;
      }
      #count {
        color: #666;
        font-size: 0.85rem;
      }
    </style>
    <script type="module" src="options.js"></script>
  </head>
  <body>
    <h1>Horse Wallpaper Options</h1>
    <p>
      新しいタブに表示する画像の URL を 1 行につき 1 件入力してください。<br />
      画像データはローカルに保存されず、表示のたびに公開 URL から取得されます。<br />
      設定内容は Edge/Chrome のアカウント同期に保存されるため、同じアカウントでサインインした他の端末にも自動で反映されます。
    </p>
    <textarea
      id="url-list"
      placeholder="https://example.com/horse1.jpg&#10;https://example.com/horse2.jpg"
    ></textarea>
    <div class="toolbar">
      <button id="save" type="button">保存</button>
      <span id="count"></span>
      <span id="status"></span>
    </div>
  </body>
</html>
